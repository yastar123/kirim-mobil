kind = "web"
previewPath = "/"
title = "Kirimmobil.com"
description = "Official vehicle-shipping company website for Kirimmobil, with route-based rate estimates, shipment schedules, real delivery documentation, and a secure operations CMS."
version = "1.0.0"
id = "artifacts/kirimmobil"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20787

[services.development]
run = "pnpm --filter @workspace/kirimmobil run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kirimmobil", "run", "build" ]
serve = "static"
publicDir = "artifacts/kirimmobil/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20787"
BASE_PATH = "/"
