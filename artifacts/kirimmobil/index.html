    <script>
      (function() {
        var _fetch = window.fetch;

        // 1. Define accessor with setter on Window.prototype & prototype chain
        var targets = [
          typeof Window !== 'undefined' ? Window.prototype : null,
          typeof window !== 'undefined' ? Object.getPrototypeOf(window) : null,
          typeof window !== 'undefined' ? window : null,
          typeof globalThis !== 'undefined' ? globalThis : null
        ];

        for (var i = 0; i < targets.length; i++) {
          var target = targets[i];
          if (!target) continue;
          try {
            Object.defineProperty(target, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return _fetch; },
              set: function(v) { _fetch = v; }
            });
          } catch (e) {}
        }

        // 2. Suppress extension & websocket errors at capture phase
        function isIgnored(err) {
          if (!err) return false;
          var str = (String(err) + ' ' + (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.filename || '')).toLowerCase();
          return str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('cannot set property fetch') !== -1 ||
                 str.indexOf('which has only a getter') !== -1 ||
                 str.indexOf('websocket') !== -1;
        }

        window.addEventListener('error', function(event) {
          if (isIgnored(event.error) || isIgnored(event.message) || (event.filename && event.filename.indexOf('chrome-extension://') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnored(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
